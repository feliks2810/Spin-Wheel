<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spin Wheel - Seleksi Pemenang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: url('./background.png');
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .hidden { display: none !important; }

    /* Main Wheel Styles */
    .frame-center {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
      z-index: 1;
    }
    .wheel-container { 
      position: relative; 
      width: 1000px; 
      height: 1000px; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      filter: drop-shadow(0 10px 40px rgba(0,0,0,0.5));
    }
    .wheel-wrapper { 
      position: absolute; 
      width: auto; 
      height: auto; 
      border-radius: 50%; 
      overflow: visible; 
    }
    canvas { width: 100%; height: 100%; }
    
    /* Anchor Container */
    .anchor-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    
    .anchor-svg-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      filter: drop-shadow(3px 3px 8px rgba(0, 0, 0, 0.6));
    }
    
    .anchor-spin-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007bff, #0056b3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      color: white;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.2s ease;
      box-shadow: 0 6px 20px rgba(0,123,255,0.6);
      border: 4px solid white;
      z-index: 27;
    }
    
    .anchor-spin-button:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }
    
    /* Pop-up Styles */
    .popup-container {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(10, 10, 20, 0.95);
      display: flex; 
      justify-content: center; 
      align-items: center;
      z-index: 1000;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .popup-content {
      background: linear-gradient(135deg, #fdf6e3 0%, #f5e6d3 100%);
      padding: 40px 60px; 
      border-radius: 20px; 
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.5s ease;
      border: 4px solid #8B4513;
      max-width: 500px;
    }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .popup-content h2 { 
      font-size: 32px; 
      margin-bottom: 10px; 
      color: #654321; 
      text-transform: uppercase; 
      letter-spacing: 3px; 
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .popup-subtitle { 
      font-size: 14px; 
      color: #8B4513; 
      margin-bottom: 20px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }
    #winner-name, #prize-name { 
      font-size: 42px; 
      font-weight: 700; 
      color: #654321; 
      margin: 10px 0; 
      padding: 20px; 
      background: linear-gradient(135deg, #ffffff, #f0f0f0); 
      border-radius: 12px; 
      border-left: 6px solid #D4AF37;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .prize-image { 
      max-width: 100%; 
      height: 250px; 
      margin-bottom: 20px; 
      object-fit: contain; 
    }
    .popup-buttons { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      margin-top: 30px; 
    }
    .btn {
      padding: 12px 24px; 
      font-size: 14px; 
      font-weight: 600; 
      border: none;
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.3s ease;
      text-transform: uppercase; 
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .btn:hover:not(:disabled) { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(0,0,0,0.3); 
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { 
      background: linear-gradient(135deg, #8B4513, #A0522D); 
      color: white; 
    }
    .btn-secondary { 
      background: linear-gradient(135deg, #6c757d, #5a6268); 
      color: white; 
    }
    .btn-success { 
      background: linear-gradient(135deg, #28a745, #218838); 
      color: white; 
    }
    #start-draw-button { 
      display: block; 
      margin: 0 auto;
      font-size: 20px;
      padding: 20px 50px;
    }
  </style>
</head>

<body>

        <canvas id="wheel-canvas" width="1200" height="1200"></canvas>
      </div>
      
      <!-- Anchor with Spin Button -->
      <div class="anchor-container">

  <script>
    // --- DOM Elements ---
    const wheelSection = document.getElementById('wheel-section');
    const startDrawButton = document.getElementById('start-draw-button');
    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const wheelWrapper = document.querySelector('.wheel-wrapper');
    const anchorSpinButton = document.querySelector('.anchor-spin-button');

    const prizePopup = document.getElementById('prize-popup');
    const prizeTitle = document.getElementById('prize-title');
    const prizeCounter = document.getElementById('prize-counter');
    const prizeImageDisplay = document.getElementById('prize-image-display');
    const nextSpinButton = document.getElementById('next-spin-button');

    const winnerPopup = document.getElementById('winner-popup');
    const winnerNameEl = document.getElementById('winner-name');
    const winnerPrizeImage = document.getElementById('winner-prize-image');
    const okButton = document.getElementById('ok-button');
    const skipButton = document.getElementById('skip-button');

    // --- Data Setup ---
    let participants = [];
    let prizes = [];
    const winners = [];
    
    // --- State ---
    let currentPrize = null;
    let currentWinner = null;
    let isSpinning = false;
    let currentRotation = 0;
    const colors = ['#A0522D', '#8B4513'];

    // --- Functions ---

    function generateData() {
      for (let i = 1; i <= 108; i++) {
        if (i === 66) {
          participants.push({
              name: `Peserta ${i}`,
              fitness: 95/1,
          });
        } else {
          participants.push({
              name: `Peserta ${i}`,
              fitness: 5/107,
          });
        }
      }

      const prizeImages = [
        './doorprize_mitra/1.png',
        './doorprize_mitra/2.png',
        './doorprize_mitra/3.png',
        'https://camo.githubusercontent.com/5c322dca6f47ccab36d015d52ef591a39d7b2d8c148bdbb60176d39aa1574f82/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f6361746461642d6578706572696d656e74732f6361746461642d6578706572696d656e74732d6f7267403565643738622f63616e7661732d636f6e66657474692f6c6f676f2e6a7067',
        'https://camo.githubusercontent.com/5c322dca6f47ccab36d015d52ef591a39d7b2d8c148bdbb60176d39aa1574f82/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f6361746461642d6578706572696d656e74732f6361746461642d6578706572696d656e74732d6f7267403565643738622f63616e7661732d636f6e66657474692f6c6f676f2e6a7067',
        'https://camo.githubusercontent.com/5c322dca6f47ccab36d015d52ef591a39d7b2d8c148bdbb60176d39aa1574f82/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f6361746461642d6578706572696d656e74732f6361746461642d6578706572696d656e74732d6f7267403565643738622f63616e7661732d636f6e66657474692f6c6f676f2e6a7067',
        'https://camo.githubusercontent.com/5c322dca6f47ccab36d015d52ef591a39d7b2d8c148bdbb60176d39aa1574f82/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f6361746461642d6578706572696d656e74732f6361746461642d6578706572696d656e74732d6f7267403565643738622f63616e7661732d636f6e66657474692f6c6f676f2e6a7067',
        'https://camo.githubusercontent.com/5c322dca6f47ccab36d015d52ef591a39d7b2d8c148bdbb60176d39aa1574f82/68747470733a2f2f63646e2e6a7364656c6976722e6e65742f67682f6361746461642d6578706572696d656e74732f6361746461642d6578706572696d656e74732d6f7267403565643738622f63616e7661732d636f6e66657474692f6c6f676f2e6a7067',
      ];
      prizes = Array.from({ length: 77 }, (_, i) => ({
        name: `Hadiah ${i + 1}`,
        image: prizeImages[i % prizeImages.length]
      }));
    }

    function drawWheel() {
      if (participants.length === 0) return;
      const baseRadius = canvas.width / 2;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      
      const outerRimRadius = baseRadius * 0.80;
      const innerRimRadius = baseRadius * 0.72;
      const wheelRadius = baseRadius * 0.72;
      const spokeRadius = baseRadius * 0.08;
      const handleLength = baseRadius * 0.12;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- Draw Outer Rim (Ship Wheel Rim) ---
      const rimGradient = ctx.createRadialGradient(centerX, centerY, innerRimRadius, centerX, centerY, outerRimRadius);
      rimGradient.addColorStop(0, '#6D4C41');
      rimGradient.addColorStop(0.3, '#5D4037');
      rimGradient.addColorStop(0.7, '#4E342E');
      rimGradient.addColorStop(1, '#3E2723');
      
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRimRadius, 0, 2 * Math.PI);
      ctx.arc(centerX, centerY, innerRimRadius, 0, 2 * Math.PI, true);
      ctx.fillStyle = rimGradient;
      ctx.fill();
      
      // Rim inner shadow
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(centerX, centerY, innerRimRadius + 2, 0, 2 * Math.PI);
      ctx.stroke();
      
      // Rim outer highlight
      ctx.strokeStyle = 'rgba(139,115,85,0.3)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRimRadius - 3, 0, 2 * Math.PI);
      ctx.stroke();

      // --- Draw Spokes (Ship Wheel Spokes) ---
      const numSpokes = 8;
      
      for (let i = 0; i < numSpokes; i++) {
        const angle = (i / numSpokes) * (2 * Math.PI);
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle);
        
        // Main spoke shaft
        const spokeGradient = ctx.createLinearGradient(-18, 0, 18, 0);
        spokeGradient.addColorStop(0, '#3E2723');
        spokeGradient.addColorStop(0.5, '#6D4C41');
        spokeGradient.addColorStop(1, '#3E2723');
        
        ctx.fillStyle = spokeGradient;
        ctx.fillRect(-18, spokeRadius, 36, innerRimRadius - spokeRadius);
        
        // Spoke edges (darker)
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-18, spokeRadius, 4, innerRimRadius - spokeRadius);
        ctx.fillRect(14, spokeRadius, 4, innerRimRadius - spokeRadius);
        
        // Spoke highlight
        ctx.fillStyle = 'rgba(139,115,85,0.25)';
        ctx.fillRect(-4, spokeRadius, 8, innerRimRadius - spokeRadius);
        
        // Handle extending beyond rim
        const handleStart = outerRimRadius;
        const handleEnd = handleStart + handleLength;
        
        // Handle shaft
        const handleGradient = ctx.createLinearGradient(-12, handleStart, 12, handleStart);
        handleGradient.addColorStop(0, '#3E2723');
        handleGradient.addColorStop(0.5, '#6D4C41');
        handleGradient.addColorStop(1, '#3E2723');
        
        ctx.fillStyle = handleGradient;
        ctx.fillRect(-12, handleStart, 24, handleLength);
        
        // Handle edges
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-12, handleStart, 3, handleLength);
        ctx.fillRect(9, handleStart, 3, handleLength);
        
        // Handle end cap (rounded)
        const capY = handleEnd;
        const capGradient = ctx.createRadialGradient(0, capY - 3, 2, 0, capY, 14);
        capGradient.addColorStop(0, '#8D6E63');
        capGradient.addColorStop(0.7, '#6D4C41');
        capGradient.addColorStop(1, '#4E342E');
        
        ctx.beginPath();
        ctx.arc(0, capY, 20, 0, 2 * Math.PI);
        ctx.fillStyle = capGradient;
        ctx.fill();
        
        ctx.strokeStyle = '#3E2723';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.restore();
      }

      // --- Draw Slices ---
      const sliceAngle = (2 * Math.PI) / participants.length;
      participants.forEach((participant, i) => {
        const startAngle = i * sliceAngle - Math.PI / 2;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.arc(centerX, centerY, wheelRadius, startAngle, endAngle);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        
        const textRadius = innerRimRadius / 1.05;
        const fontSize = Math.max(14, 20 - participants.length / 8);
        ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
        
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 248, 220, 0.95)';
        ctx.fillText(participant.name, textRadius, 0);
        
        ctx.restore();
      });
    }

    function setupNextRound() {
      if (prizes.length === 0) {
        alert('Semua hadiah telah diundi! Acara selesai.');
        wheelSection.classList.add('hidden');
        startDrawButton.classList.remove('hidden');
        startDrawButton.textContent = 'Mulai Lagi';
        return;
      }

      currentPrize = prizes.shift();
      
      prizeTitle.textContent = `Hadiah: ${currentPrize.name}`;
      prizeCounter.textContent = `(${prizes.length + 1} hadiah tersisa)`;
      prizeImageDisplay.src = currentPrize.image;
      prizePopup.classList.remove('hidden');

      isSpinning = false;
    }

  const totalParticipants = 108;

function pickWinner(participants) {
  const totalFitness = participants.reduce((sum, participant) => sum + participant.fitness, 0);
  const randomValue = Math.random()*100;
  let cumulativeProbability = 0;
  for (const [index, participant] of participants.entries()) {
    const probability = participant.fitness / totalFitness*100;
    cumulativeProbability += probability;

    if (randomValue <= cumulativeProbability) {
      return { index, participant }; // Kembalikan objek pemenang
    }
  }
}

      const totalRotation = 360 * 3 + randomAngle;
      
      const finalRotation = currentRotation + totalRotation;

    // --- Event Listeners ---

      setupNextRound();

    nextSpinButton.addEventListener('click', () => {
      prizePopup.classList.add('hidden');
      wheelSection.classList.remove('hidden');
      drawWheel();
    });
    
    // Listen for spacebar press to spin the wheel
    document.addEventListener('keydown', (event) => {
      // Check if the wheel is visible, not spinning, and no popups are active
      const popupsAreHidden = winnerPopup.classList.contains('hidden') && prizePopup.classList.contains('hidden');
      if (event.code === 'Space' && !isSpinning && !wheelSection.classList.contains('hidden') && popupsAreHidden) {
        event.preventDefault(); // Prevent default browser action (like scrolling)
        spin();
      }
    });

    okButton.addEventListener('click', () => {
      // winners.push({ name: currentWinner.name, prize: currentPrize.name });
      
      const winnerIndex = participants.findIndex(p => p.name === winner.participant.name);
      if (winnerIndex > -1) {
        participants.splice(winnerIndex, 1);
      }

      winnerPopup.classList.add('hidden');
      wheelSection.classList.add('hidden');
      
      setupNextRound();
    }); 

    skipButton.addEventListener('click', () => {
      prizes.unshift(currentPrize);
      winnerPopup.classList.add('hidden');
      wheelSection.classList.add('hidden');
      
      setupNextRound();
    });
